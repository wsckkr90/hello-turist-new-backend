name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  deploy:
    # Main pushes deploy only after the repository variable GCP_DEPLOY_ENABLED is explicitly set to true.
    # Manual workflow_dispatch always allows the job to run.
    if: github.event_name == 'workflow_dispatch' || vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      # Public phone contact; optional until an approved number is configured in repository variables.
      ADMIN_SUPPORT_PHONE: ${{ vars.ADMIN_SUPPORT_PHONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for value in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing repository variable: $value"
              exit 1
            fi
          done
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "::error::Missing repository secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Missing repository secret: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push container
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/hello-turist-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          RUNTIME_SERVICE_ACCOUNT: hello-turist-cloud-run@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          CLOUD_SQL_INSTANCE: ${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:hello-turist-postgres
          VPC_NETWORK: projects/${{ env.GCP_PROJECT_ID }}/global/networks/default
          VPC_SUBNET: projects/${{ env.GCP_PROJECT_ID }}/regions/${{ env.GCP_REGION }}/subnetworks/default
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "$VPC_NETWORK" \
            --subnet "$VPC_SUBNET" \
            --vpc-egress private-ranges-only \
            --set-env-vars "NODE_ENV=production,PORT=8080,HOST=0.0.0.0,ADMIN_SUPPORT_PHONE=${ADMIN_SUPPORT_PHONE}" \
            --set-secrets "DATABASE_URL=hello-turist-database-url:latest,REDIS_URL=hello-turist-redis-url:latest,ACCESS_TOKEN_SECRET=hello-turist-access-token-secret:latest,REFRESH_TOKEN_SECRET=hello-turist-refresh-token-secret:latest,GOOGLE_MAPS_API_KEY=hello-turist-google-maps-api-key:latest,FIREBASE_PROJECT_ID=hello-turist-firebase-project-id:latest,FCM_SERVICE_ACCOUNT_EMAIL=hello-turist-fcm-service-account-email:latest,FCM_PRIVATE_KEY=hello-turist-fcm-private-key:latest,RAZORPAY_KEY_ID=hello-turist-razorpay-key-id:latest,RAZORPAY_KEY_SECRET=hello-turist-razorpay-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=hello-turist-razorpay-webhook-secret:latest,CLOUDINARY_CLOUD_NAME=hello-turist-cloudinary-cloud-name:latest,CLOUDINARY_API_KEY=hello-turist-cloudinary-api-key:latest,CLOUDINARY_API_SECRET=hello-turist-cloudinary-api-secret:latest" \
            --quiet

      - name: Verify deployed revision
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format='value(status.url)')"
          echo "Deployed revision: $REVISION"
          echo "Service URL: $SERVICE_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$SERVICE_URL/health"
          echo
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$SERVICE_URL/ready"
          echo
