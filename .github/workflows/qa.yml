name: Backend QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Monthly pass pricing unit tests
        run: npm run test:monthly-pass-pricing
      - name: Registration terms-consent regression tests
        run: npx tsx tests/social-auth-consent.test.ts
      - name: Admin phone-verification schema regression tests
        run: npx tsx tests/admin-phone-verification-schema.test.ts
      - name: Notification-delivery policy tests
        run: npx tsx tests/notification-delivery-policy.test.ts
      - name: Public support-contact configuration tests
        run: npx tsx tests/support-contact.test.ts
      - name: Security middleware tests
        run: npx tsx tests/security.middleware.test.ts
      - name: E2E smoke
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "STAGING_BASE_URL is not configured; skipping staging smoke."
            exit 0
          fi
          npm run test:e2e-smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      - name: Trusted contacts E2E
        run: |
          if [ -z "$TEST_BASE_URL" ] || [ -z "$TEST_AUTH_TOKEN" ]; then
            echo "Trusted Contacts E2E credentials are not configured; skipping."
            exit 0
          fi
          npm run test:trusted-contacts
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          TEST_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
      - name: Production integration E2E
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ] || [ -z "$RAZORPAY_KEY_ID" ] || [ -z "$RAZORPAY_KEY_SECRET" ]; then
            echo "Production integration credentials are not configured; skipping."
            exit 0
          fi
          npm run test:production-integrations
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          E2E_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
